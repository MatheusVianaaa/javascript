<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div#area{
            font: normal 20pt Arial;
            background-color: #f0f0f0;
            padding: 10px;
            margin: 20px;
            width: 300px;
            border: 1px solid #ccc;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area">
        <p>DIV INTERATIVA</p>
    </div>
<script>
    a.addEventListener('click', clicar);
    a.addEventListener('mouseover', passar);
    a.addEventListener('mouseout', voltar);
    var a = document.getElementById('area');
    function clicar() {
        a.innerHTML = '<p>Clicou!</p>';
    }
    function passar() {
        a.innerHTML = '<p>Passou!</p>';
    }
    function voltar() {
        a.innerHTML = '<p>saiu</p>';
    }
</script>
</body>
</html>
