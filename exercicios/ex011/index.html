<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idades votantes</title>
    <style>
        body{
            background-color: purple;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
        }
        button {
            
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }
        .content {
            display: flex;
            flex-direction: column;
            margin: 20px auto;
            max-width: 400px;
        }
        p#resultado {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 class="content">Idades dos Votantes</h1>
    <p class="content">Digite uma idade:</p>
    <input class="content" type="number" id="idadeInput" min="0">
    <button class="content" onclick="mostrarIdade()">Adicionar Idade</button>
    <p  class="content" id="resultado"></p>

    <script>
        var idade = 0;
        function mostrarIdade(){
            idade = parseInt(document.getElementById('idadeInput').value);
        if (idade < 16) {
            document.getElementById('resultado').innerText = 'A pessoa não pode votar.';
        } else if (idade >= 16 && idade < 18 || idade >= 70) {
            document.getElementById('resultado').innerText = 'O voto é facultativo para essa pessoa.';
        } else {
            document.getElementById('resultado').innerText = 'O voto é obrigatório para essa pessoa.';
        } if (isNaN(idade) || idade < 0 || idade >= 110) {
            document.getElementById('resultado').innerText = 'Por favor, insira uma idade válida.';
        }}
    </script>
</body>
</html>
